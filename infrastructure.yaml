AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation Template to provision infrastructure for the serverless coffee shop

Parameters:
  DynamoDBtable:
    Description: Name of the dynamodb table
    Type: String
    Default: orderId
  SQSName:
    Description: Name of the SQS Queue 
    Type: String 
    Default: coffee-shop-queue
  Key1:
    Type: String
    Default: submit-order.zip
  Key2:
    Type: String
    Default: process-orders.zip
  APIName:
    Type: String 
    Default: CoffeeShopAPI
  APIDeployStage:
    Type: String
    Default: prod
  bucketname: 
    Type: String
    Default: go-to-sleep-enable-cors
  CloudwatchLogGrouplambda1:
    Type: String
    Default: submitlambdaCloudwatchLogGroup
  CloudwatchLogGrouplambda2:
    Type: String
    Default: processlambdaCloudwatchLogGroup

Resources:
  SQSQueue:
    Type: AWS::SQS::Queue 
    Properties:
      QueueName: !Ref SQSName 

  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: !Ref DynamoDBtable
          AttributeType: S
      KeySchema: 
        - AttributeName: !Ref DynamoDBtable
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: '5'
        WriteCapacityUnits: '5'
      TableName: orders

  submitlambdaLogGroup:
    Type: AWS::Logs::LogGroup 
    Properties: 
      LogGroupName: !Ref CloudwatchLogGrouplambda1
      RetentionInDays: 1
  
  processlambdaLogGroup:
    Type: AWS::Logs::LogGroup 
    Properties: 
      LogGroupName: !Ref CloudwatchLogGrouplambda2
      RetentionInDays: 1 
  
  APIGWLogGroup:
    Type: AWS::Logs::LogGroup 
    Properties: 
      LogGroupName: !Join
        - '-'
        - - !Ref coffeeRESTAPI
          - access-logs
      RetentionInDays: 1

  submitLambdaIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      RoleName: send-message-lambda-sqs-execution-role
      Policies: 
        - PolicyName: Policy_api-lambda-sqs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt SQSQueue.Arn
              - Effect: Allow
                Action: 
                  - s3:GetObject
                Resource:
                  - !Sub 
                    - "${BktArn}/*"
                    - BktArn: !ImportValue S3BucketArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

  processLambdaIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      RoleName: process-orders-lambda-sqs-execution-role
      Policies: 
        - PolicyName: Policy_api-lambda-sqs-db
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt DynamoDBTable.Arn
              - Effect: Allow
                Action: 
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt SQSQueue.Arn
              - Effect: Allow
                Action: 
                  - s3:GetObject
                Resource:
                  - !Sub 
                    - "${BktArn}/*"
                    - BktArn: !ImportValue S3BucketArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
      
  APIGWIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonApiGatewayPushToCloudWatchLogs

  Account:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt APIGWIAMRole.Arn
  
  submitLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.14
      FunctionName: submit-orders
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref submitlambdaLogGroup
      Role: !GetAtt submitLambdaIAMRole.Arn
      Handler: submit-order.lambda_handler
      Code:
        S3Bucket: !ImportValue BucketName
        S3Key: !Ref Key1

  processLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.14
      FunctionName: process-orders
      LoggingConfig: 
        LogFormat: JSON
        LogGroup: !Ref processlambdaLogGroup
      Role: !GetAtt processLambdaIAMRole.Arn
      Handler: process-orders.lambda_handler
      Code:
        S3Bucket: !ImportValue BucketName
        S3Key: !Ref Key2

  SQSTriggerforLambda:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref processLambdaFunction
      EventSourceArn: !GetAtt SQSQueue.Arn

  coffeeRESTAPI:
    Type: AWS::ApiGateway::RestApi 
    Properties: 
      Name: !Ref APIName
      EndpointConfiguration: 
        Types:
          - REGIONAL
  
  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref coffeeRESTAPI
      ParentId: !GetAtt
        - coffeeRESTAPI
        - RootResourceId
      PathPart: orders

  OPTIONSMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref coffeeRESTAPI
      ResourceId: !Ref OrdersResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type, X-Amz-Date, Authorization, X-Api-Key, X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST, OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        PassthroughBehavior: NEVER
        RequestTemplates: 
          application/json: '{"statusCode": 200}'
        Type: MOCK
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: 'Empty'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods:  false
            method.response.header.Access-Control-Allow-Origin: false

  POSTMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref coffeeRESTAPI
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ''
          - - 'arn:aws:apigateway:'
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !GetAtt
              - submitLambdaFunction
              - Arn
            - "/invocations"

  APIDeploy:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref coffeeRESTAPI
    DependsOn: 
      - POSTMethod

  APIStage:
    Type: AWS::ApiGateway::Stage 
    Properties:
      AccessLogSetting:
        DestinationArn: !GetAtt APIGWLogGroup.Arn
        Format: $context.extendedRequestId $context.identity.sourceIp $context.resourcePath $context.status $context.requestId
      DeploymentId: !Ref APIDeploy
      RestApiId: !Ref coffeeRESTAPI
      StageName: !Ref APIDeployStage
      MethodSettings:
        - ResourcePath: /orders
          HttpMethod: OPTIONS
          LoggingLevel: INFO
        - ResourcePath: /orders
          HttpMethod: POST
          LoggingLevel: INFO
                   
  APIInvokeLambdaRole:
    Type: AWS::Lambda::Permission
    Properties: 
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt submitLambdaFunction.Arn
      Principal: apigateway.amazonaws.com

  S3CoffeeWebsite:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref bucketname
      PublicAccessBlockConfiguration: 
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration: 
        IndexDocument: index.html
  
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties: 
      Bucket: !Ref S3CoffeeWebsite
      PolicyDocument: 
        Version: 2012-10-17
        Statement:
        - Action:
            - s3:GetObject
          Effect: Allow
          Resource: !Join
            - ''
            - - 'arn:aws:s3:::'
              - !Ref S3CoffeeWebsite
              - /*
          Principal: '*'

Outputs:
  DynamoDB:
    Value: !Ref DynamoDBTable
    Export:
      Name: DynamoDB-Table

  QueueURL:
    Value : !GetAtt SQSQueue.QueueUrl
    Export: 
      Name: Queue-URL
  
  WebsiteURL:
    Value: !GetAtt
      - S3CoffeeWebsite
      - WebsiteURL
    Description: URL to the static website(coffee shop)
  
  S3BucketURL:
    Value: !Join
      - ''
      - - 'https://'
        - !GetAtt
          - S3CoffeeWebsite
          - DomainName 
    Description: Name of the bucket containing website(coffee shop) content
  
  APIEndpoint:
    Value: !Sub 
      - https://${APIGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
      - APIGateway: !Ref coffeeRESTAPI
        Environment: !Ref APIDeployStage
    Export:
      Name: APIGatewayEndpoint